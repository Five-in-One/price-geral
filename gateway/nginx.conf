# API Gateway / proxy reverso do Price (Entrega 4).
#
# É o único contêiner com porta aberta para a máquina (80). Todo o resto
# (price-auth, price-user, as 3 réplicas do price-back, Postgres, RabbitMQ e o
# worker do bot) só existe na rede interna do Docker.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # DNS interno do Docker. "valid=5s" faz o Nginx reconsultar o nome
    # price-back a cada 5 s: réplicas que caem somem da lista e as que sobem
    # (ou voltam com outro IP) entram sozinhas.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Log que comprova o balanceamento: para cada requisição, qual réplica
    # respondeu (IP:porta do upstream e o hostname do contêiner, que o
    # price-back devolve no cabeçalho X-Instance).
    log_format gateway '$remote_addr "$request" $status '
                       'upstream=$upstream_addr instance=$upstream_http_x_instance '
                       'rt=$request_time';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    # --- Upstreams --------------------------------------------------------

    # price-back escalado horizontalmente (deploy.replicas: 3 no compose).
    # O nome "price-back" resolve para os 3 contêineres; "resolve" mantém a
    # lista atualizada. Algoritmo: Round Robin (o padrão do Nginx), uma
    # requisição para cada réplica, em rodízio.
    # max_fails/fail_timeout: depois de 1 falha a réplica fica 10 s fora do
    # rodízio (detecção passiva de nó caído).
    upstream price_back {
        zone price_back 64k;
        server price-back:8080 resolve max_fails=1 fail_timeout=10s;
    }

    # Authorization Server: login, cadastro e emissão do JWT.
    upstream price_auth {
        zone price_auth 64k;
        server price-auth:8081 resolve;
    }

    # Resource Server de dados do usuário (listas salvas).
    upstream price_user {
        zone price_user 64k;
        server price-user:8082 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Preservação de contexto: o serviço de trás enxerga o cliente
        # original, não o IP do gateway.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Failover: se a réplica escolhida recusar a conexão, estourar o tempo
        # ou responder 502/503/504, o Nginx tenta a próxima réplica na mesma
        # requisição. O cliente continua recebendo 200.
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Mostra na resposta (Postman/Insomnia) qual réplica atendeu.
        add_header X-Upstream $upstream_addr always;

        # --- Roteamento por caminho da URI ----------------------------------

        # /api/auth/* -> Authorization Server (cujas rotas são /auth/*).
        location /api/auth/ {
            proxy_pass http://price_auth/auth/;
        }

        # Rotas do price-user.
        location ~ ^/api/(shopping-lists|economy|savings-history)(/|$) {
            proxy_pass http://price_user;
        }

        # Todo o resto de /api/* -> price-back (mercados, produtos,
        # comparação, catálogo, coleta), balanceado entre as 3 réplicas.
        location /api/ {
            proxy_pass http://price_back;
        }

        # Health do price-back passando pelo balanceador.
        location = /health {
            proxy_pass http://price_back/health;
        }

        # Health de cada serviço, para conferência.
        location = /health/auth { proxy_pass http://price_auth/health; }
        location = /health/user { proxy_pass http://price_user/health; }

        # --- Painéis web (arquivos estáticos servidos pelo próprio Nginx) ---

        location = /admin   { return 301 /admin/; }
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
        }

        location = /empresa { return 301 /empresa/; }
        location /empresa/ {
            alias /usr/share/nginx/html/empresa/;
            index index.html;
        }

        location = / {
            default_type text/html;
            return 200 '<!doctype html><meta charset="utf-8"><title>Price</title><h1>Price - gateway</h1><ul><li><a href="/admin/">Painel Administrativo</a></li><li><a href="/empresa/">Página da Empresa</a></li><li><a href="/health">/health (price-back)</a></li></ul>';
        }
    }
}
