# Price — sistema completo (Entrega 4: segurança com JWT + escalabilidade).
#
#   docker compose up -d --build
#
# Só o gateway (Nginx) publica porta na máquina: http://localhost (80).
# Os demais serviços conversam apenas pela rede interna "price-net".
#
#   /api/auth/*                      -> price-auth  (Authorization Server, emite o JWT)
#   /api/shopping-lists|economy|...  -> price-user  (Resource Server)
#   /api/*                           -> price-back  (Resource Server, 3 réplicas, Round Robin)
#   /admin/  /empresa/               -> painéis web (estáticos no próprio Nginx)

name: price

x-jwt: &jwt
  # Segredo HS256 compartilhado: o price-auth assina, os Resource Servers
  # conferem a assinatura. Defina JWT_SECRET no .env (veja .env.example).
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./price-admin-web:/usr/share/nginx/html/admin:ro
      - ./price-empresa-web:/usr/share/nginx/html/empresa:ro
    depends_on:
      price-back:
        condition: service_healthy
      price-auth:
        condition: service_healthy
      price-user:
        condition: service_healthy
    restart: unless-stopped
    networks: [price-net]

  price-auth:
    build: ./price-auth
    environment:
      <<: *jwt
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/price_auth_db?sslmode=disable
      PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [price-net]

  price-user:
    build: ./price-user
    environment:
      <<: *jwt
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/price_user_db?sslmode=disable
      PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [price-net]

  # Serviço de negócio escalado horizontalmente: 3 réplicas idênticas atrás
  # do balanceador do Nginx. Cada uma devolve seu hostname em X-Instance.
  price-back:
    build: ./price-back
    deploy:
      replicas: 3
    environment:
      <<: *jwt
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/price_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [price-net]

  # Consome os pedidos de coleta do Painel Admin (fila bot.collect) e grava os
  # produtos no price-back passando pelo gateway, com o JWT do seu login.
  price-bot-worker:
    build: ./price-bot
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/price_bot_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PRICE_BACK_URL: http://gateway
      PRICE_AUTH_URL: http://gateway/api
      BOT_USERNAME: ${BOT_USERNAME:-admin}
      BOT_PASSWORD: ${BOT_PASSWORD:-TrocarSenha123!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [price-net]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: price_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./price-back/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [price-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [price-net]

networks:
  price-net:
    driver: bridge

volumes:
  # Mesmos volumes do docker-compose antigo do price-back, para manter os dados
  # locais (contas, mercados, produtos coletados). Em uma máquina nova eles são
  # criados vazios e as migrations recriam os dados de demonstração.
  pgdata:
    name: price-back_price_back_pgdata
  rabbitmq:
    name: price-back_price_rabbitmq_data
